## Integration Example

```python
# Usage in ObsAgent dashboard or reports generation

import asyncio
from obs_agent.query_service import QueryService, KPIType

async def generate_analytics_report():
    """Generate analytics report using multi-agent system."""
    
    # Initialize query service
    qs = QueryService()
    
    # Get top vintages by strategy
    rankings = await qs.get_vintage_ranking(
        KPIType.DELINQUENCY_RATE, 
        top_n=5
    )
    
    # Compare two vintages  
    comparison = await qs.compare_vintages(2017, 2018)
    
    return {
        'rankings': rankings,
        'comparison': comparison
    }
```

