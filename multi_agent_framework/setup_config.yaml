### 3. Precompute Aggregates

```bash
python3 << 'PRECOMPUTE'
import pandas as pd
import chromadb
from pathlib import Path

base_path = "/Users/dany/Desktop/ObsAgent/ObsAgent/ChromaDB/chroma_data"
source_file = "base_cards_sintetica.csv"
aggregation_dir = Path(base_path) / "precomputed_aggregates"

# Load source data
print(f"Loading {source_file}...")
df = pd.read_csv(source_file)

# Precompute aggregates by category dimension
categories = ['vintage', 'strategy_segment', 'product']

for cat in categories:
    agg_df = df.groupby(cat).size().reset_index(name=f'{cat}_count')
    agg_df[f'{cat}_sum'] = agg_df[f'{cat}_count'].sum()
    
    # Upsert to ChromaDB
    client = chromadb.PersistentClient(base_path)
    coll_name = f"aggregates_{cat}_lowercase"
    
    if not client.get_collection(coll_name):
        coll = client.create_collection(
            name=coll_name,
            metadata={"description": f"{cat.capitalize()} aggregation"}
        )
        coll.upsert(
            documents=[f"{cat} aggregated by row"],
            embeddings=[[0.5]*64 for _ in range(len(agg_df))],  # placeholder
            metadatas=[{cat: str(cat)}] * len(agg_df)
        )
        print(f"Created {len(agg_df)} aggregates for {cat}")
    else:
        client.get_collection(coll_name).upsert(..., documents=f"{cat} aggregated")

print("Precomputed aggregates complete!")
PRECOMPUTE
```

