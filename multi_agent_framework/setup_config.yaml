# ObsAgent Multi-Agent Configuration

This configuration sets up the multi-agent system for ObsAgent.

## Architecture Overview

The multi-agent system implements three specialized agents working in sequence:

1. **Researcher Agent** - Consults ChromaDB and performs analysis
2. **Translator Agent** - Translates queries to English, returns results to source language  
3. **Builder Agent** - Generates HTML reports and downloadable outputs

## Setup Instructions

### 1. Install Dependencies

Create a requirements file:

```bash
cat > requirements-MA-framework.txt << 'EOF'
chromadb>=0.4.0
ollama[py-cudf]>=0.1.0
